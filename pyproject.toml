[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-mcp"
version = "1.0.2"
description = "给 agent 用的桌面操作 MCP 服务器（Windows）：看屏幕、点鼠标、敲键盘、管窗口"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "desktop", "automation", "windows", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]

# 运行时只依赖两个纯 Python 库：
#   mss    —— 全屏截图（比 PIL.ImageGrab 快，支持多显示器）
#   Pillow —— 图像缩放与编码成 PNG
# win32_input / win32_window 是 ctypes 直接调 user32，零依赖。
# 观察框的 Electron 运行时另算（见 README「便携版」一节）。
dependencies = [
    "mss>=9.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# 开发用：跑 tools/ 下的检查脚本
dev = []

[project.urls]
Homepage = "https://github.com/Jestions-dev/desktop-mcp"

[project.scripts]
desktop-mcp = "desktop_mcp.server:main"

[tool.setuptools]
packages = ["desktop_mcp"]
